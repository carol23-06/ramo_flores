<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una sorpresa</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#3b2f5c;--soft:#6f6494;--lav:#e6deff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:linear-gradient(#f8f4ff,#ffe9f4);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;display:flex;justify-content:center;text-align:center}
main{width:100%;max-width:460px;padding:20px 14px 32px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
svg{width:100%;max-width:400px;display:block;margin:0 auto}
h1{font-size:30px;margin:8px 0 6px}
p{color:var(--soft);font-size:18px;line-height:1.4;margin:0 0 18px}
.btn{border:0;border-radius:999px;padding:14px 26px;font:600 18px inherit;font-family:inherit;background:var(--lav);color:var(--ink);cursor:pointer}
.st{fill:none;stroke:#7fbf9a;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.4s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.fl,.lf{animation:bloom 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bloom{from{transform:scale(0) rotate(-50deg)}to{transform:none}}
.wr,.late{opacity:0;animation:fade 1s forwards}
.wr{animation-delay:3.5s}.late{animation-delay:4.4s}
@keyframes fade{to{opacity:1}}
.sway{transform-origin:160px 340px;animation:sw 4s ease-in-out 5s infinite}
@keyframes sw{50%{transform:rotate(2deg)}}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.st{stroke-dashoffset:0}.wr,.late{opacity:1}}
</style></head><body>
<main id="m"></main><canvas id="cv"></canvas>
<script>
const NAME="Ariadna";
const $=id=>document.getElementById(id);
const P=(x,y,a)=>`rotate(${a} ${x} ${y})`;
const K='stroke="#b9787a" stroke-opacity=".35"';
function rose(x,y,r,c){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${K}/><circle cx="${x}" cy="${y}" r="${r*.7}" fill="${c}" ${K}/><circle cx="${x-r*.05}" cy="${y-r*.05}" r="${r*.42}" fill="${c}" ${K}/><path d="M${x-r*.25} ${y}a${r*.25} ${r*.22} 0 1 1 ${r*.5} 0" fill="none" stroke="#b9787a" stroke-opacity=".5"/>`}
function ger(x,y,r,c){let s="";for(let i=0;i<14;i++)s+=`<ellipse cx="${x}" cy="${y-r*.62}" rx="${r*.13}" ry="${r*.4}" transform="${P(x,y,i*360/14)}" fill="${c}"/>`;return s+`<circle cx="${x}" cy="${y}" r="${r*.27}" fill="#7b1f4f"/><circle cx="${x}" cy="${y}" r="${r*.13}" fill="#f2c94c"/>`}
function alst(x,y,r,c){let s="";for(let i=0;i<6;i++)s+=`<g transform="${P(x,y,i*60)}"><ellipse cx="${x}" cy="${y-r*.5}" rx="${r*.3}" ry="${r*.52}" fill="${c}" stroke="#fff" stroke-opacity=".7"/><path d="M${x} ${y-r*.15}L${x} ${y-r*.6}" stroke="#c2456f" stroke-width="1.5" stroke-linecap="round"/></g>`;return s+`<circle cx="${x}" cy="${y}" r="${r*.1}" fill="#f2c94c"/>`}
function dai(x,y,r,c){let s="";for(let i=0;i<12;i++)s+=`<ellipse cx="${x}" cy="${y-r*.65}" rx="${r*.13}" ry="${r*.36}" transform="${P(x,y,i*30)}" fill="${c}"/>`;return s+`<circle cx="${x}" cy="${y}" r="${r*.28}" fill="#c9d36a" stroke="#a4b04a"/>`}
function ant(x,y,r,c){return `<path d="M${x} ${y+r*.9}C${x-r*1.3} ${y-r*.1} ${x-r*.5} ${y-r} ${x} ${y-r*.2}C${x+r*.5} ${y-r} ${x+r*1.3} ${y-r*.1} ${x} ${y+r*.9}Z" fill="${c}" stroke="#8e1046" stroke-opacity=".4"/><path d="M${x} ${y+r*.6}L${x} ${y-r*.5}" stroke="#f6c453" stroke-width="3" stroke-linecap="round"/>`}
const T={r:rose,g:ger,a:alst,d:dai,h:ant};
const g=(x,y,d,h)=>`<g class="fl" style="transform-origin:${x}px ${y}px;animation-delay:${d}s">${h}</g>`;
const F=[["a",160,52,24,"#f8a9c8"],["r",110,72,24,"#fdf0e4"],["r",210,70,24,"#fff"],["h",70,105,20,"#c2185b"],["a",250,105,23,"#f8a9c8"],
["r",160,98,28,"#fbe3cf"],["d",118,118,16,"#e6b3e8"],["d",202,116,16,"#e6b3e8"],["g",80,140,32,"#ee6fa8"],["a",240,148,24,"#f8a9c8"],
["r",125,150,28,"#fff"],["h",176,140,20,"#c2185b"],["r",205,165,26,"#fdf0e4"],["d",55,165,15,"#e6b3e8"],["d",268,178,15,"#e6b3e8"],
["g",165,192,34,"#ee6fa8"],["a",100,190,26,"#f8a9c8"],["r",225,205,26,"#fbe3cf"],["d",70,205,16,"#e6b3e8"],["a",135,225,22,"#f8a9c8"],
["r",190,235,24,"#fff"],["d",245,235,14,"#e6b3e8"],["r",105,238,22,"#fdf0e4"],["d",160,255,14,"#e6b3e8"]];
const HD=[[160,52],[80,140],[240,148],[165,192],[100,190],[225,205],[55,165],[268,178],[160,98]];
const E=[[40,150,-70],[285,150,70],[50,215,-50],[275,225,50],[100,258,-20],[215,262,20],[160,32,0],[80,60,-40],[240,58,40]];
const GY=[[58,120],[262,130],[45,190],[282,200],[160,30],[90,52],[230,45],[150,170]];
function play(){
const R=F.map((f,i)=>i).sort((a,b)=>F[b][2]-F[a][2]),dl=[];R.forEach((i,k)=>dl[i]=1.3+k*.09);
const gy=(x,y,d)=>g(x,y,d,[[0,0],[9,-5],[-8,-7],[6,8],[-9,6],[14,3],[-14,-1],[2,-13],[-3,13]].map(p=>`<circle cx="${x+p[0]}" cy="${y+p[1]}" r="3" fill="#fff" stroke="#e7e0f0"/>`).join(""));
$("m").innerHTML=`<svg viewBox="0 0 320 380" aria-hidden="true"><g class="sway">
${HD.map((h,i)=>`<path class="st" pathLength="1" d="M160 285Q${(h[0]+160)/2} ${(h[1]+285)/2+20} ${h[0]} ${h[1]}" style="animation-delay:${i*.12}s"/>`).join("")}
${E.map((e,i)=>`<ellipse class="lf" cx="${e[0]}" cy="${e[1]}" rx="11" ry="22" fill="${i%2?"#8fb8a0":"#6f9b83"}" transform="${P(e[0],e[1],e[2])}" style="transform-box:fill-box;transform-origin:center;animation-delay:${1+i*.08}s"/>`).join("")}
${F.map((f,i)=>g(f[1],f[2],dl[i],T[f[0]](f[1],f[2],f[3],f[4]))).join("")}
${GY.map((p,i)=>gy(p[0],p[1],3.2+i*.05)).join("")}
<path class="wr" d="M92 266L228 266L194 368L126 368Z" fill="#c99a6b" stroke="#a3703f" stroke-width="2"/><path class="wr" d="M92 266L160 302L228 266" fill="#dcb488" stroke="#a3703f" stroke-width="2"/>
<g class="wr"><ellipse cx="139" cy="305" rx="21" ry="11" transform="rotate(-20 139 305)" fill="#ffb3d9"/><ellipse cx="181" cy="305" rx="21" ry="11" transform="rotate(20 181 305)" fill="#ffb3d9"/><circle cx="160" cy="306" r="7" fill="#ff8fc4"/></g></g></svg>
<div class="late"><h1>Un ramito para ti 💐</h1><p>Feliz aniversario, ${NAME}. Es virtual, pero está hecho con muchísimo cariño 💕</p><button class="btn" id="re">Verlo otra vez</button></div>`;
$("re").onclick=play;setTimeout(confetti,4600)}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=$("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const col=["#ffb3d9","#ffd48a","#9be3c0","#b9a6ff","#8fd0ff"];
const p=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,vy:2+Math.random()*3,vx:-1+Math.random()*2,c:col[Math.random()*5|0],a:Math.random()*6}));let f=0;
(function d(){x.clearRect(0,0,c.width,c.height);p.forEach(o=>{o.y+=o.vy;o.x+=o.vx+Math.sin(o.a+=.05);x.fillStyle=o.c;x.fillRect(o.x,o.y,o.r,o.r*1.6)});if(++f<260)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
play();
</script></body></html>
